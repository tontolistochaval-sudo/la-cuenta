# Latido: evita que Supabase (plan gratis) pause el proyecto por inactividad.
# Cada 3 días hace una consulta mínima a la base de datos. Con las reglas de seguridad
# no lee ningún dato (devuelve []), pero cuenta como actividad.
# La URL y la clave "publishable" ya son públicas (van dentro de la web), así que pueden ir aquí.
name: Latido Supabase

on:
  schedule:
    - cron: '17 9 */3 * *' # cada 3 días, 9:17 UTC
  workflow_dispatch: # para lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  latido:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://xeqhklysycfezaiaqgww.supabase.co
      SUPABASE_KEY: sb_publishable_XG2Fh7fVA26-SEc4dDzZLA_kuX5JwQD
    steps:
      - name: Consulta mínima a la base de datos
        run: |
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' --retry 3 --retry-delay 20 \
            "$SUPABASE_URL/rest/v1/entradas?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Respuesta: $code $(cat /tmp/r.json)"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase no responde ($code). Si el proyecto está pausado, reactívalo en supabase.com."
            exit 1
          fi

      # GitHub desactiva las tareas programadas de repos sin actividad en 60 días:
      # una vez al mes se apunta la fecha del último latido para que siga viva.
      - uses: actions/checkout@v4
      - name: Marca mensual de actividad
        run: |
          f=.github/ultimo-latido.txt
          mes=$(date -u +%Y-%m)
          if [ "$(cut -c1-7 "$f" 2>/dev/null)" != "$mes" ]; then
            date -u +%Y-%m-%dT%H:%MZ > "$f"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$f"
            git commit -m "Latido de Supabase: $mes"
            git push
          else
            echo "Ya hay marca este mes."
          fi
